<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InfraAgent AI | Sovereign Infrastructure</title>
    <style>
        /* CORE SOVEREIGN STYLING - NO EXTERNAL DEPENDENCIES */
        :root { --bg: #020617; --card: #0f172a; --accent: #2563eb; --text: #f8fafc; --muted: #94a3b8; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; line-height: 1.5; padding: 20px; }
        
        .container { max-width: 500px; margin: 0 auto; }
        header { text-align: center; padding: 40px 0; }
        h1 { font-size: 2.5rem; font-weight: 900; text-transform: uppercase; letter-spacing: -1px; font-style: italic; color: #fff; }
        .subtitle { color: var(--accent); font-size: 0.75rem; font-weight: 700; letter-spacing: 0.3em; text-transform: uppercase; }

        .card { background: var(--card); border: 1px solid #1e293b; border-radius: 20px; padding: 24px; margin-bottom: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h2 { font-size: 1.25rem; margin-bottom: 12px; border-bottom: 1px solid #334155; padding-bottom: 8px; }
        p { font-size: 0.85rem; color: var(--muted); margin-bottom: 20px; }

        /* BUTTONS */
        .btn-blue { display: block; width: 100%; background: var(--accent); color: white; text-decoration: none; text-align: center; padding: 16px; border-radius: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.1em; border: none; cursor: pointer; }
        .btn-white { display: block; width: 100%; background: #ffffff; color: #000; text-decoration: none; text-align: center; padding: 18px; border-radius: 12px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.2em; border: none; cursor: pointer; margin-top: 20px; }

        /* FORM LOGIC */
        .field { margin-bottom: 20px; }
        label { display: block; color: #fff !important; font-weight: 700; font-size: 0.8rem; text-transform: uppercase; margin-bottom: 8px; letter-spacing: 0.05em; }
        input, select, textarea { width: 100%; background: #020617; border: 1px solid #334155; padding: 14px; border-radius: 10px; color: #fff; font-size: 1rem; outline: none; }
        input:focus { border-color: var(--accent); }
        .checkbox-group { display: flex; align-items: flex-start; background: #020617; padding: 12px; border-radius: 10px; border: 1px solid #334155; }
        .checkbox-group input { width: auto; margin-right: 12px; margin-top: 4px; }
        .checkbox-group label { font-size: 0.7rem; color: var(--muted) !important; text-transform: none; font-weight: 400; margin-bottom: 0; }

        footer { text-align: center; padding: 40px 0; color: #334155; font-size: 10px; letter-spacing: 0.2em; border-top: 1px solid #1e293b; margin-top: 20px; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <p class="subtitle">Sovereign Architect</p>
            <h1>InfraAgent AI</h1>
        </header>

        <div class="card" style="border-top: 4px solid var(--accent);">
            <h2>The Sovereign Blueprint</h2>
            <p>Full n8n logic, Cloudflare hardening, and global export compliance documentation.</p>
            <a href="YOUR_DODO_LINK_HERE" class="btn-blue">Purchase Blueprint</a>
        </div>

        <div class="card">
            <h2 style="margin-bottom: 24px;">Mission Verification</h2>
            <form action="YOUR_N8N_WEBHOOK_URL" method="POST">
                
                <div class="field">
                    <label>1. Monthly "SaaS Rent" Loss?</label>
                    <input type="text" name="saas_leakage" placeholder="e.g. $500/mo" required>
                </div>

                <div class="field">
                    <label>2. Required Infrastructure Grade?</label>
                    <select name="infra_grade">
                        <option>Grade I (Foundational)</option>
                        <option>Grade II (Hardened Stack)</option>
                        <option>Grade III (Full Agentic Oracle)</option>
                    </select>
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" name="compliance" required>
                    <label>I am prepared to transition to a 2048-bit RSA hardened environment under InfraAgent AI protocols.</label>
                </div>

                <div class="field" style="margin-top: 20px;">
                    <label>4. Designated Mission Budget?</label>
                    <select name="budget">
                        <option>$1,250 - $3,500</option>
                        <option>$3,500 - $10,000</option>
                        <option>$10,000+</option>
                    </select>
                </div>

                <div class="field">
                    <label>5. Final Sovereign Decision Maker?</label>
                    <input type="text" name="decision_maker" placeholder="Name & Title" required>
                </div>

                <button type="submit" class="btn-white">Verify Mission</button>
            </form>
        </div>

        <footer>
            UDYAM-PB-11-0050125 | IEC BRJPS8738J | INFRAAGENT AI
        </footer>
    </div>

</body>
</html>
